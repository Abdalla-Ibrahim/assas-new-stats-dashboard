[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @workspace/api-server run build"
watchPatterns = [
  "artifacts/api-server/**",
  "lib/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "railway.toml",
]

[build.nixpacksPlan.phases.install]
cmds = ["pnpm install --no-frozen-lockfile --ignore-scripts"]

[deploy]
startCommand = "pnpm --filter @workspace/api-server run start"
restartPolicyType = "ON_FAILURE"
